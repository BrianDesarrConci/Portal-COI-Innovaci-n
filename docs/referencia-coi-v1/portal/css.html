/**
 * Registra el arqueo de caja en la hoja de cálculo.
 * @param {Object} datos - Objeto con usuario, fecha, totales y observaciones.
 */
function registrarArqueo(datos) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let hojaArqueos = ss.getSheetByName("ARQUEOS");

    // 1. Si la hoja no existe, la creamos con sus encabezados
    if (!hojaArqueos) {
      hojaArqueos = ss.insertSheet("ARQUEOS");
      const encabezados = ["Fecha y Hora", "Cajero / Usuario", "Efectivo Físico", "Saldo en Libros", "Diferencia", "Observaciones"];
      
      hojaArqueos.getRange(1, 1, 1, encabezados.length)
        .setValues([encabezados])
        .setBackground("#002e5b")
        .setFontColor("white")
        .setFontWeight("bold");
      
      // Congelar la primera fila
      hojaArqueos.setFrozenRows(1);
    }

    // 2. Insertar los datos en la siguiente fila disponible
    hojaArqueos.appendRow([
      datos.fecha,
      datos.usuario,
      datos.totalFisico,
      datos.saldoLibros,
      datos.diferencia,
      datos.observaciones
    ]);

    // 3. Dar formato de moneda a las columnas de dinero (C, D y E)
    const ultimaFila = hojaArqueos.getLastRow();
    hojaArqueos.getRange(ultimaFila, 3, 1, 3).setNumberFormat("$ #,##0");

    // 4. (Opcional) Color automático para la diferencia
    const celdaDiferencia = hojaArqueos.getRange(ultimaFila, 5);
    if (datos.diferencia < 0) {
      celdaDiferencia.setFontColor("red"); // Faltante
    } else if (datos.diferencia > 0) {
      celdaDiferencia.setFontColor("blue"); // Sobrante
    } else {
      celdaDiferencia.setFontColor("green"); // Cuadrado
    }

    return { success: true, mensaje: "Arqueo registrado correctamente" };

  } catch (error) {
    console.error("Error en registrarArqueo: " + error.toString());
    throw new Error("No se pudo guardar el arqueo: " + error.message);
  }
}
