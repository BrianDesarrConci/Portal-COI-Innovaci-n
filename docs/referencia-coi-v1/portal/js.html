function filtrarTabla(idContenedor, texto) {
  const filtro = texto.toUpperCase();
  const tabla = document.getElementById(idContenedor).getElementsByTagName("table")[0];
  if (!tabla) return;
  const filas = tabla.getElementsByTagName("tr");
  for (let i = 1; i < filas.length; i++) {
    const visible = Array.from(filas[i].cells).some(td => td.innerText.toUpperCase().includes(filtro));
    filas[i].style.display = visible ? "" : "none";
  }
}

function calcularDistanciaKM(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function prepararAsignacion(id, nombreCajero, oficinaNombre) {
  const divTabla = document.getElementById('tabla-backups');
  const info = document.getElementById('info-novedad-activa');
  gestionSeleccionada = null;
  info.style.display = "none";
  info.innerHTML = "";

  divTabla.style.display = 'block';
  divTabla.innerHTML = "<p><i class='fas fa-spinner fa-spin'></i> Buscando los mejores backups...</p>";
  info.style.display = 'block';
  info.innerHTML = `<div style="background:#002e5b; color:white; padding:10px; border-radius:5px;">🔍 Analizando perfiles para cubrir <b>${oficinaNombre}</b>...</div>`;
  google.script.run.withSuccessHandler(listaCompleta => {
    const oficinaAfectada = listaCompleta.find(f => f[1] === oficinaNombre);
    if (!oficinaAfectada) { alert("No se encontraron datos para la oficina: " + oficinaNombre); return; }
    const datosOrigen = { ciudad: oficinaAfectada[4], lon: parseFloat(oficinaAfectada[5]) || 0, lat: parseFloat(oficinaAfectada[6]) || 0, negocio: oficinaAfectada[7] };
    gestionSeleccionada = { id, nombre: nombreCajero, oficina: oficinaNombre };
    aplicarFiltroInteligente(datosOrigen, nombreCajero);
  }).obtenerListaCajeros();
}

function aplicarFiltroInteligente(origen, nombrePersonaDeBaja) {
  document.getElementById("panel-backups").style.display = "block";
  google.script.run.withSuccessHandler(backups => {
    const candidatos = backups.map(b => {
      const nombreCandidato = b[9] ? b[9].toString().trim().toUpperCase() : "";
      const personaABorrar = nombrePersonaDeBaja ? nombrePersonaDeBaja.trim().toUpperCase() : "";
      if (nombreCandidato === personaABorrar || nombreCandidato === "") return null;
      let pts = 0;
      const formatearCoordenada = (val) => {
        if (!val) return 0;
        let n = parseFloat(val.toString().replace(',', '.'));
        if (Math.abs(n) > 180) {
          let s = n.toString().replace('.', '');
          let posicionPunto = s.startsWith('-') ? 3 : 2;
          n = parseFloat(s.slice(0, posicionPunto) + "." + s.slice(posicionPunto));
        }
        return n;
      };
      const lonB = formatearCoordenada(b[5]);
      const latB = formatearCoordenada(b[6]);
      const lonO = formatearCoordenada(origen.lon);
      const latO = formatearCoordenada(origen.lat);
      const dist = calcularDistanciaKM(latO, lonO, latB, lonB);
      const ciudadCandidato = (b[4] || "").toString().trim().toUpperCase();
      const ciudadOficina = (origen.ciudad || "").toString().trim().toUpperCase();
      if (ciudadCandidato === ciudadOficina && ciudadCandidato !== "") pts += 100;
      const negocioOficina = (origen.negocio || "").toString().trim().toUpperCase();
      const negocioCandidato = (b[7] || "").toString().trim().toUpperCase();
      if (negocioCandidato === negocioOficina && negocioCandidato !== "") pts += 50;
      pts -= dist;
      return { nombre: b[9], oficina: b[1], ciudad: b[4], negocio: b[7], telefono: b[21], distancia: dist.toFixed(1), puntos: Math.round(pts) };
    }).filter(c => c !== null);
    candidatos.sort((a, b) => b.puntos - a.puntos);
    listaBackupsActual = candidatos;
    renderizarTablaFiltrada(listaBackupsActual);
  }).obtenerCajerosBackup();
}

function renderizarTablaFiltrada(candidatos) {
  const panel = document.getElementById("panel-backups");
  const div = document.getElementById("tabla-backups");
  if (!gestionSeleccionada) { if (panel) panel.style.display = "none"; return; }
  if (panel) panel.style.display = "block";
  if (!candidatos || candidatos.length === 0) { div.innerHTML = "<p style='color:#e67e22;'>⚠️ No se encontraron candidatos disponibles.</p>"; return; }
  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <input id="buscar-backup" type="text" placeholder="🔍 Buscar backup..." onkeyup="filtrarBackups()" style="width:65%; padding:10px; border:1px solid #ccc; border-radius:6px;">
      <span id="contador-backups" style="font-weight:bold; color:#002e5b;">👥 ${candidatos.length} disponibles</span>
    </div>
    <table><thead><tr><th>Puntaje</th><th>Nombre</th><th>Oficina Base</th><th>Ciudad</th><th>Negocio</th><th>Distancia</th><th>Acción</th></tr></thead>
    <tbody id="tbody-backups">${construirFilasBackups(candidatos)}</tbody></table>
    <button onclick="cancelarGestion()" style="margin-top:12px; background:#7f8c8d; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;"><i class="fas fa-times"></i> Cancelar gestión</button>`;
  div.innerHTML = html;
}

function construirFilasBackups(candidatos) {
  let html = "";
  candidatos.forEach(c => {
    const pts = Math.round(c.puntos);
    const colorScore = pts > 100 ? "#27ae60" : pts > 50 ? "#f39c12" : "#7f8c8d";
    html += `<tr>
      <td style="text-align:center;"><span style="background:${colorScore}; color:white; padding:3px 8px; border-radius:10px; font-weight:bold; font-size:0.8rem;">${pts} pts</span></td>
      <td><b>${c.nombre}</b></td><td>${c.oficina}</td><td>${c.ciudad}</td><td><span class="badge">${c.negocio || "—"}</span></td><td style="font-weight:bold;">${c.distancia} km</td>
      <td>
        <button onclick="procesarAsignacionBackup('${gestionSeleccionada.id}','${c.nombre}')" style="background:#27ae60;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">Asignar</button>
        <button onclick="enviarWhatsApp('${c.nombre}','${c.telefono}','${gestionSeleccionada.oficina}','${gestionSeleccionada.negocio}')" style="background:#25D366;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">📱 Mensaje</button>
      </td></tr>`;
  });
  return html;
}

function cancelarGestion() {

function procesarAsignacionBackup(idNovedad, nombreBackupSeleccionado) {

  google.script.run.withSuccessHandler(function(res) {
    if (res && res.success) {

      cargarNovedadesPendientes();
      cargarHistorialNovedadesCompleto();
    } else { alert("⚠️ " + (res ? res.msg : "Error desconocido")); }
  }).withFailureHandler(function(err) { alert("❌ Error de comunicación con el servidor: " + err.message); })
  .asignarBackup(idNovedad, nombreBackupSeleccionado, usuarioActivo.nombre);
}

function enviarWhatsApp(nombre, telefono, oficina, negocio) {
  if (!telefono || telefono === "" || telefono === "undefined") { alert("⚠️ No hay teléfono registrado para " + nombre); return; }
  var num = telefono.toString().replace(/\D/g, '');
  if (!num.startsWith('57')) num = '57' + num;
  var msg = "Hola *" + nombre + "*, se requiere tu apoyo en la oficina *" + oficina + "* para el negocio *" + negocio + "*. Me comunicaré contigo en unos minutos para ampliar la informacion.";
  window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), '_blank');
}

    if (res.success) { cargarHistorialNovedadesCompleto(); if (typeof cargarNovedadesPendientes === 'function') cargarNovedadesPendientes(); }
  }).procesarAccionNovedad({ id: idNovedad, accion: "CERRAR", adminNombre: usuarioActivo.nombre });
}

function extenderNovedad(idNovedad) {
  const diasNuevos = prompt("¿Cuántos días adicionales deseas sumarle a esta ausencia?");
  if (diasNuevos === null) return;
  const diasNum = parseInt(diasNuevos);
  if (isNaN(diasNum) || diasNum <= 0) { alert("⚠️ Por favor ingresa un número de días válido."); return; }
  google.script.run.withSuccessHandler(res => {
    alert(res.msg);
    if (res.success) cargarHistorialNovedadesCompleto();
  }).procesarAccionNovedad({ id: idNovedad, accion: "EXTENDER", dias: diasNum });
}

function aplicarPermisos() {

  if (!usuarioActivo || !usuarioActivo.rol) return;

  const rol = usuarioActivo.rol.toString().toUpperCase().trim();

  // ==========================================
  // USUARIOS QUE NO SON ADMIN
  // ==========================================
  // Ven TODO el aplicativo.
  // No se aplican las restricciones de PERMISOS.
  if (rol !== "ADMIN") {

    document.querySelectorAll('[id^="menu-"]').forEach(elemento => {
      elemento.style.display = "flex";
    });

    document.querySelectorAll('[id^="card-"]').forEach(card => {
      card.style.display = "block";
    });

    return;
  }

  // ==========================================
  // ADMIN
  // ==========================================
  // ADMIN conserva el sistema de permisos actual.
  if (!usuarioActivo.permisos) return;

  Object.keys(usuarioActivo.permisos).forEach(modulo => {

    const elemento = document.getElementById("menu-" + modulo);

    if (elemento) {
      elemento.style.display =
        usuarioActivo.permisos[modulo] ? "flex" : "none";
    }

    const card = document.getElementById("card-" + modulo);

    if (card) {
      card.style.display =
        usuarioActivo.permisos[modulo] ? "block" : "none";
    }

  });
}

function cargarPermisos(){
  google.script.run.withSuccessHandler(construirTablaPermisos).obtenerTablaPermisos();
}

function construirTablaPermisos(datos){
  let html = `<table style="width:100%; border-collapse:collapse;"><thead><tr style="background:#002e5b;color:white;">`;
  datos[0].forEach(columna => { html += `<th style="padding:10px;">${columna}</th>`; });
  html += `</tr></thead><tbody>`;
  for(let i=1;i<datos.length;i++){
    html += "<tr>";
    for(let j=0;j<datos[i].length;j++){
      if(j==0){ html += `<td style="padding:10px;font-weight:bold;">${datos[i][j]}</td>`; }
      else{
        const checked = datos[i][j]=="SI" ? "checked" : "";
        html += `<td style="text-align:center;"><input type="checkbox" data-usuario="${datos[i][0]}" data-modulo="${datos[0][j]}" ${checked} onchange="activarGuardarPermisos()"></td>`;
      }
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("tablaPermisos").innerHTML = html;
}

function abrirPermisos(){ showSection("admin-permisos"); cargarPermisos(); }

function cargarUsuarios(){
  google.script.run.withSuccessHandler(datos => { renderizarTablaUsuarios(datos); })
  .withFailureHandler(err => { document.getElementById("tablaUsuarios").innerHTML = `<p style="color:red;">Error al cargar usuarios.<br>${err.message}</p>`; })
  .obtenerUsuarios();
}

function renderizarTablaUsuarios(datos){
  let html = `<table class="tabla-reval"><thead><tr><th>Usuario</th><th>Rol</th><th>Correo</th><th>Acciones</th><th>Estado</th></tr></thead><tbody>`;
  datos.forEach(u=>{
    html += `<tr><td>${u[0]}</td><td>${u[2]}</td><td>${u[3]}</td>
      <td>
        <button class="btn-icon btn-editar" data-user="${u[0]}" onclick="editarUsuario('${u[0]}')" title="Editar usuario"><i class="fas fa-edit"></i></button>
        <button class="btn-icon btn-password" data-user="${u[0]}" title="Cambiar contraseña"><i class="fas fa-key"></i></button>
        <button class="btn-icon btn-bloquear" data-user="${u[0]}" title="Activar / Desactivar"><i class="fas fa-user-slash"></i></button>
      </td>
      <td><span class="estado-activo">🟢 Activo</span></td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("tablaUsuarios").innerHTML = html;
}

function abrirUsuarios(){ showSection("admin-usuarios"); cargarUsuarios(); }

function activarGuardarPermisos(){
  const btn = document.getElementById("btnGuardarPermisos");
  btn.disabled = false;
  btn.classList.remove("btn-disabled");
  btn.classList.add("btn-success");
}

function guardarPermisos(){
  const checks = document.querySelectorAll("#tablaPermisos input[type='checkbox']");
  let permisos = {};
  checks.forEach(check => {
    const usuario = check.dataset.usuario;
    const modulo = check.dataset.modulo;
    if(!permisos[usuario]) permisos[usuario] = {};
    permisos[usuario][modulo] = check.checked;
  });
  google.script.run.withSuccessHandler(() => {
    document.getElementById("btnGuardarPermisos").disabled = true;
    alert("Permisos actualizados correctamente.");
  }).withFailureHandler(err => { alert(err.message); }).guardarPermisos(permisos);
}

function guardarNuevoUsuario(){
  const usuario = document.getElementById("nuevoUsuario").value.trim();
  const password = document.getElementById("nuevoPassword").value.trim();
  const correo = document.getElementById("nuevoCorreo").value.trim();
  const rol = document.getElementById("nuevoRol").value;
  const estado = document.getElementById("nuevoEstado").value;
  
  if(!usuario || !password || !correo){ alert("Debes completar todos los campos."); return; }
  
  const datos = { usuario, password, correo, rol, estado };
  const proceso = (modoUsuario === "crear") ? "crearUsuario" : "actualizarUsuario";
  
  google.script.run.withSuccessHandler(res=>{
    if(res.success){
      alert(modoUsuario === "crear" ? "Usuario creado correctamente." : "Usuario actualizado correctamente.");
      cerrarModalUsuario();
      cargarUsuarios();
    } else { alert(res.msg); }
  }).withFailureHandler(err=>{ alert(err.message); })[proceso](datos);
}

function editarUsuario(usuario){
  modoUsuario = "editar";
  google.script.run.withSuccessHandler(res=>{
    if(!res.success){ alert(res.msg); return; }
    abrirModalUsuario();
    document.querySelector("#modalUsuario h2").innerHTML = '<i class="fas fa-user-edit"></i> Editar Usuario';
    document.getElementById("nuevoUsuario").value = res.usuario;
    document.getElementById("nuevoPassword").value = res.password;
    document.getElementById("nuevoCorreo").value = res.correo;
    document.getElementById("nuevoRol").value = res.rol;
    document.getElementById("nuevoEstado").value = res.estado;
    document.getElementById("nuevoUsuario").disabled = true;
  }).obtenerUsuario(usuario);
}
