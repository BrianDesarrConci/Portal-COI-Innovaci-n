<body>
  <div id="login-screen" class="login-container">

    <div class="login-card">

      <!-- Panel izquierdo -->
      <div class="login-left">
        <div>
          <h1>COI</h1>
          <div class="linea"></div>
          <p>
                Sistema inteligente de gestión de novedades,
                asignación automática de backups y seguimiento operativo.
          </p>
        </div>

        <div class="secure-box">
          <span>🔒</span>
          <div>
            <small>Acceso seguro</small><br>
            <strong>Uso corporativo</strong>
          </div>
        </div>
      </div>

      <!-- Panel derecho -->
      <div class="login-right">

        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="userLogin" placeholder="Usuario">
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="passLogin" placeholder="••••••••">
        </div>

        <button class="btn-login" onclick="intentarLogin()">
          Entrar al Sistema
        </button>

        <p id="loginError" class="login-error"></p>

      </div>
    </div>
  </div>
</body>
