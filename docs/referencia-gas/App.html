<script>
(function () {
  'use strict';

  /* =========================================================
     COI, demo de la versión final.
     Navegación interna (sin cambiar la URL) para que funcione
     dentro del iframe de Apps Script.
     ========================================================= */
  const D = window.DEMO;
  if (!D) {
    document.body.innerHTML = '<div style="font-family:Arial,sans-serif;padding:40px;color:#242A54"><h2>No se cargaron los datos de demostración</h2><p>Verifique que el archivo Data exista con ese nombre exacto y que Index lo incluya antes de App.</p></div>';
    return;
  }

  /* ================= Utilidades ================= */
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const fmt = (n, d) => Number(n).toLocaleString('es-CO', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  const pct = (n, d) => fmt(n, d === undefined ? 1 : d) + ' %';
  const money = (n) => '$ ' + fmt(n);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const longDate = (d) => DAYS[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
  const shortDate = (iso) => { const d = new Date(iso + 'T12:00:00'); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear(); };
  function demoNow() { const n = new Date(); const m = n.getHours() * 60 + n.getMinutes(); if (m < 8 * 60 + 30 || m > 19 * 60 + 20) n.setHours(15, 40, 0, 0); return n; }
  const toMin = (t) => { const p = t.split(':').map(Number); return p[0] * 60 + p[1]; };
  const hhmm = (min) => { const h = Math.floor(min / 60), m = min % 60; return (h > 12 ? h - 12 : h) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' p. m.' : ' a. m.'); };

  /* ================= Iconos de línea ================= */
  const P = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    building: '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/>',
    filecheck: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/>',
    inbox: '<path d="M3 13l3-8h12l3 8"/><path d="M3 13v6h18v-6h-5l-1.5 2h-5L8 13z"/>',
    message: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
    bell: '<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>',
    chart: '<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    store: '<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v1a3 3 0 01-5.3 2 3 3 0 01-5.4 0A3 3 0 014 10z"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    flow: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 6h7M6 8.5V14a4 4 0 004 4h5.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    back: '<path d="M15 6l-6 6 6 6"/>',
    download: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    chat: '<path d="M20 12a8 8 0 01-11.6 7.1L4 20l1-4.2A8 8 0 1120 12z"/>',
    form: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    ticket: '<path d="M4 7h16v3a2 2 0 000 4v3H4v-3a2 2 0 000-4z"/><path d="M14 7v10"/>',
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/>',
    sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    upload: '<path d="M12 20V9"/><path d="M7 14l5-5 5 5"/><path d="M4 4h16"/>',
    file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
    star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/>',
    pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
    package: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M8 6l8 4M12 12v8M4 8l8 4 8-4"/>',
    wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h5M3 9h18"/>',
    usercheck: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5 1.4 0 2.7.3 3.8 1"/><path d="M15 18l2 2 4-4"/>',
    send: '<path d="M21 3L3 10.5l7 3 3 7z"/><path d="M10 13.5L21 3"/>',
    warn: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/>'
  };
  const ic = (name, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (P[name] || '') + '</svg>';

  /* ================= Modelo derivado ================= */
  const acts = D.BASE.acts;
  const clients = D.BASE.clients;
  const AN = {}; D.analysts.forEach((a, i) => { AN[a.id] = Object.assign({ color: i % 6 }, a); });
  const PR = {}; D.processes.forEach((p) => { PR[p.id] = p; });
  const MODULE_VIEW = { N1: 'validacion', N2: 'novedades', N3: 'pqr', N4: 'alertas', N5: 'reporteria', N6: 'facturacion', N7: 'oficinas', N8: 'fincomercio', N9: 'ptr', G1: 'malas', G2: 'papeleria', G3: 'usuarios', G4: 'cheques', G5: 'agrario', G6: 'ingresos', TRAZA: 'traza', N0: 'inicio' };
  const PROC_VIEW = { T1: 'validacion', T2: 'pqr', T3: 'malas', T4: 'novedades', T5: 'alertas', T6: 'usuarios', T7: 'ptr', T8: 'reporteria', T9: 'facturacion', T10: 'fincomercio', T11: 'oficinas' };
  const procName = (id) => id === 'M' ? 'Se mantiene (monitoreo)' : id === 'P0' ? 'Tablero gerencial' : (PR[id] ? PR[id].name : id);
  const isAuto = (a) => a.p !== 'M' && a.p !== 'P0';
  const avatar = (id, lg) => { const a = AN[id]; return '<span class="avatar ' + (lg ? 'lg ' : '') + 'c' + (a ? a.color : 0) + '" title="' + (a ? a.name : 'Gerencia') + '">' + (a ? a.initials : 'G') + '</span>'; };
  const firstName = (id) => AN[id] ? AN[id].name.split(' ')[0] : 'Gerencia';

  const NOW = demoNow();
  const NOW_MIN = NOW.getHours() * 60 + NOW.getMinutes();
  const daySeed = NOW.getFullYear() * 1000 + NOW.getMonth() * 40 + NOW.getDate();
  const PREV_MONTH = MONTHS[(NOW.getMonth() + 11) % 12];

  const todayState = {};
  acts.forEach((a) => {
    const r = rng(hash('act' + a.n) ^ daySeed)();
    let st;
    if (/Por evento|Proyecto/.test(a.f)) st = r < 0.82 ? 'done' : 'progress';
    else if (/Mensual|Bimensual|Semestral|Anual|Quincenal/.test(a.f)) st = r < 0.9 ? 'done' : 'scheduled';
    else st = r < 0.84 ? 'done' : r < 0.95 ? 'progress' : 'scheduled';
    if (a.n === 61 || a.n === 49 || a.n === 77) st = 'done';
    if (a.n === 20) st = 'risk';
    todayState[a.n] = st;
  });
  const ST = { done: ['Cerrada con evidencia', 'b-ok'], progress: ['En curso', 'b-info'], scheduled: ['Programada', 'b-mute'], risk: ['En riesgo', 'b-warn'] };

  function analystStats(id) {
    const list = acts.filter((a) => a.a === id);
    const auto = list.filter(isAuto).length;
    const done = list.filter((a) => todayState[a.n] === 'done').length;
    const risk = list.filter((a) => todayState[a.n] === 'risk').length;
    const due = list.filter((a) => todayState[a.n] !== 'scheduled').length;
    const r = rng(hash(id));
    const series = Array.from({ length: 30 }, (_, i) => 94 + r() * 5.6 + i * 0.03);
    const freed = id === 'hernan' ? 6.5 : AN[id].baseHours * 5 * (0.52 + r() * 0.12);
    return { list, auto, total: list.length, done, risk, due, comp: due ? (done / due) * 100 : 100, series, month: series.slice(-20).reduce((s, v) => s + v, 0) / 20, freed };
  }
  const STATS = {}; D.analysts.forEach((a) => { STATS[a.id] = analystStats(a.id); });
  const clientActs = (cid) => acts.filter((a) => a.c.indexOf(cid) >= 0);

  /* ================= Componentes ================= */
  const badge = (st) => '<span class="badge ' + ST[st][1] + '">' + ST[st][0] + '</span>';
  const tag = (txt, cls) => '<span class="badge ' + (cls || 'b-mute') + '">' + txt + '</span>';
  const bar = (v, cls) => '<div class="bar ' + (cls || '') + '"><i style="width:' + Math.max(0, Math.min(100, v)) + '%"></i></div>';
  function head(title, sub, right, crumb, code) {
    return (crumb ? '<div class="crumb">' + crumb + '</div>' : '') + '<div class="page-head"><div><h1>' + title + (code ? ' <span class="chip" style="vertical-align:middle;font-family:var(--font-body);font-size:12px">Módulo ' + code + '</span>' : '') + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (right ? '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' + right + '</div>' : '') + '</div>';
  }
  const crumb = (path, label) => '<button class="linkbtn" data-go="' + path + '">' + label + '</button>';
  const kpi = (label, value, sub, icon, unit) => '<div class="card kpi"><div class="lbl"><span class="kx-ic">' + ic(icon) + '</span>' + label + '</div><div class="val num">' + value + (unit ? '<small>' + unit + '</small>' : '') + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  const kpis = (arr) => '<div class="grid g4">' + arr.map((k) => kpi.apply(null, k)).join('') + '</div>';
  function card(title, sub, body, right, flush, extra) {
    return '<div class="card ' + (extra || '') + '"><div class="card-h"><div><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (right || '') + '</div><div class="card-b ' + (flush ? 'flush scroll-x' : '') + '">' + body + '</div></div>';
  }
  function T(headers, rows, opts) {
    opts = opts || {};
    const al = opts.align || [];
    return '<table class="t"><thead><tr>' + headers.map((h, i) => '<th class="' + (al[i] || '') + '">' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map((r) => '<tr' + (r.go ? ' class="click" data-go="' + r.go + '"' : '') + (r.act ? ' class="click" data-act="' + r.act + '"' + (r.data ? ' data-k="' + r.data + '"' : '') : '') + '>' + (r.cells || r).map((c, i) => '<td class="' + (al[i] || '') + '" data-label="' + String(headers[i] || '').replace(/<[^>]*>/g, '').replace(/"/g, '') + '">' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }
  const cm = (main, sub) => '<div class="cell-main">' + main + '</div>' + (sub ? '<div class="cell-sub">' + sub + '</div>' : '');
  let tabSeq = 0;
  function tabs(items) {
    const id = 'tb' + (++tabSeq);
    return '<div class="tabs" role="tablist">' + items.map((t, i) => '<button class="' + (i ? '' : 'on') + '" data-tab="' + id + '-' + i + '" role="tab">' + t[0] + '</button>').join('') + '</div>' +
      items.map((t, i) => '<div id="' + id + '-' + i + '"' + (i ? ' hidden' : '') + '>' + t[1] + '</div>').join('');
  }
  function gasFrame(code, name, body) {
    return '<div class="gas-frame"><div class="gas-bar">' + ic('lock', 'lock') + '<span>Módulo ' + code + ' de Apps Script embebido en COI, ' + name + '. Sesión única activa.</span></div><div class="gas-body">' + body + '</div></div>';
  }
  function spark(values, w, h, color) {
    w = w || 120; h = h || 32; color = color || 'var(--green)';
    const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    const pts = values.map((v, i) => [(i / (values.length - 1)) * w, h - 3 - ((v - min) / (max - min || 1)) * (h - 6)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="2.8" fill="' + color + '"/></svg>';
  }
  function lineChart(series, labels, opts) {
    opts = opts || {}; const W = opts.w || 720, H = opts.h || 220, pl = 52, pr = 16, pt = 14, pb = 26;
    const all = series.reduce((a, s) => a.concat(s.data), []);
    let min = opts.min !== undefined ? opts.min : Math.min.apply(null, all), max = opts.max !== undefined ? opts.max : Math.max.apply(null, all);
    if (max === min) max = min + 1;
    const x = (i) => pl + (i / (labels.length - 1)) * (W - pl - pr);
    const y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = min + (k / 4) * (max - min); g += '<line class="grid-l" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (opts.fmt ? opts.fmt(v) : fmt(v)) + '</text>'; }
    const step = Math.ceil(labels.length / 8);
    labels.forEach((l, i) => { const last = i === labels.length - 1; if ((i % step === 0 && labels.length - 1 - i >= step / 2) || last) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + l + '</text>'; });
    series.forEach((s) => {
      const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
      if (s.area) g += '<path d="' + d + ' L' + x(s.data.length - 1) + ' ' + y(min) + ' L' + x(0) + ' ' + y(min) + 'Z" fill="' + s.color + '" opacity="0.08"/>';
      g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="5 5"' : '') + '/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(opts.label || 'Gráfico') + '">' + g + '</svg>';
  }
  function hbars(rows, color, min) {
    const max = Math.max.apply(null, rows.map((r) => r[1])); min = min || 0;
    return rows.map((r) => '<div class="hb"><span class="small ellip">' + r[0] + '</span>' + bar((r[1] - min) / (max - min || 1) * 100, color) + '<span class="small num" style="text-align:right">' + (r[2] || fmt(r[1])) + '</span></div>').join('');
  }
  function docRow(title, sub, icon, right) { return '<div class="doc"><span class="ico">' + ic(icon || 'file') + '</span><div class="grow"><div class="strong">' + title + '</div><div class="small muted">' + sub + '</div></div>' + (right || '') + '</div>'; }
  const listRow = (left, main, sub, right, go) => '<div class="list-row' + (go ? ' click" data-go="' + go : '') + '">' + (left || '') + '<div class="grow"><div class="strong ellip">' + main + '</div>' + (sub ? '<div class="small muted">' + sub + '</div>' : '') + '</div>' + (right || '') + '</div>';

  /* ================= Superposiciones ================= */
  function toast(msg) {
    const w = $('#toasts'); const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = ic('check') + '<span>' + msg + '</span>'; w.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3200);
  }
  function modal(title, body, foot) {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="modal-h"><h3>' + title + '</h3><button class="btn btn-g btn-sm" data-close>' + ic('x') + 'Cerrar</button></div><div class="modal-b">' + body + '</div>' + (foot ? '<div class="modal-f">' + foot + '</div>' : '') + '</div>';
    bg.addEventListener('click', (e) => {
      if (e.target === bg || e.target.closest('[data-close]')) { const msg = e.target.closest('[data-done]'); bg.remove(); if (msg) toast(msg.dataset.done); }
    });
    document.body.appendChild(bg); const b = $('[data-close]', bg); if (b) b.focus();
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const m = $('.modal-bg'); if (m) m.remove(); } });

  /* ================= Vistas ================= */
  const V = {};
  let timers = [];
  const every = (fn, ms) => { timers.push(setInterval(fn, ms)); };

  /* ---------- N0 Tablero gerencial ---------- */
  /* Serie diaria simulada desde enero de 2025 para comparar periodos completos. */
  const SERIES = (function () {
    const out = []; const r = rng(20250101);
    const startD = new Date(2025, 0, 1), endD = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    const total = (endD - startD) / 864e5;
    const base = [0, 96, 92, 90, 90, 98, 34];
    let bdInMonth = 0, lastMonth = -1;
    for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
      const wd = d.getDay(); if (wd === 0) continue;
      if (d.getMonth() !== lastMonth) { lastMonth = d.getMonth(); bdInMonth = 0; }
      if (wd !== 6) bdInMonth++;
      const p = Math.min(1, ((d - startD) / 864e5) / total);
      const prog = Math.round(base[wd] + (bdInMonth <= 5 && wd !== 6 ? 22 : 0) + (r() - 0.5) * 8);
      const comp = Math.min(0.996, 0.902 + 0.074 * p + (r() - 0.5) * 0.024);
      const ans = Math.min(0.999, 0.935 + 0.058 * p + (r() - 0.5) * 0.02);
      out.push({
        d: new Date(d), key: d.toISOString().slice(0, 10), wd, p, prog, done: Math.round(prog * comp), ans,
        hours: Math.max(0, (wd === 6 ? 1.5 : 4) + 22 * p + (r() - 0.5) * 3),
        cases: Math.round((wd === 6 ? 14 : 44) + (r() - 0.5) * 12), pqr: Math.round(2 + r() * 3), alerts: Math.round(2 + r() * 4)
      });
    }

    caso: (b) => { const it = NOV[+b.dataset.k]; const c = CH[it[0]]; modal('Caso NOV-' + (2610 + +b.dataset.k * 7), '<div class="grid g2" style="margin-bottom:16px"><div>' + cm(it[2], it[1]) + '</div><div style="text-align:right">' + tag(it[5], it[5] === 'Alta' ? 'b-bad' : 'b-warn') + ' <span class="countdown">' + leftTime(it[4]) + '</span></div></div><div class="timeline-v"><div class="it cur"><div class="strong">Recibido por ' + c[2].toLowerCase() + '</div><div class="small muted">Clasificado por el sistema y asignado a ' + AN[it[3]].name + '</div></div><div class="it cur"><div class="strong">Confirmación automática al cliente</div><div class="small muted">Con número de caso y plazo del ANS</div></div><div class="it"><div class="strong">Gestión de la analista</div><div class="small muted">Pendiente</div></div></div>' + input('Respuesta al cliente', '<textarea rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px">Buen día. Su solicitud está en gestión; le confirmaremos el cierre por este medio.</textarea>'), '<button class="btn btn-o" data-close>Cerrar</button><button class="btn btn-p" data-close data-done="Respuesta enviada y caso actualizado.">Enviar respuesta</button>'); },
    pqr: (b) => { const x = PQR[+b.dataset.k]; modal(x[0] + ', ' + x[1], '<div class="timeline-v"><div class="it cur"><div class="strong">Radicada por código QR</div><div class="small muted">' + x[2] + '</div></div><div class="it ' + (x[4] ? 'cur' : '') + '"><div class="strong">Ampliación de información</div><div class="small muted">' + x[4] + ' de 3 permitidas</div></div><div class="it ' + (/líder|video/.test(x[3]) ? 'cur' : '') + '"><div class="strong">Respuesta del líder</div><div class="small muted">Solicitada por el sistema</div></div><div class="it"><div class="strong">Respuesta al cliente</div><div class="small muted">' + x[5] + ' días hábiles restantes</div></div></div>', '<button class="btn btn-o" data-close data-done="Caso escalado a Jurídica.">Escalar a Jurídica</button><button class="btn btn-p" data-close data-done="Ampliación de información solicitada.">Pedir ampliación</button>'); },
    acta: (b) => modal('Acta de comité, ' + b.dataset.k, '<div class="paper"><h4>Acta de comité de seguimiento</h4><div class="small muted" style="margin-bottom:12px">' + b.dataset.k + ' y Reval S.A.S. Periodo: ' + PREV_MONTH + '.</div>' + T(['Indicador', 'Meta', 'Resultado'], [['Cumplimiento de ANS', '95 %', '98,7 %'], ['Requerimientos atendidos en plazo', '95 %', '97,8 %'], ['Novedades operativas cerradas', '100 %', '100 %'], ['Evaluación del servicio', '4,0', '4,6']].map((r) => [r[0], '<span class="num">' + r[1] + '</span>', '<span class="num strong">' + r[2] + '</span>']), { align: ['', 'r', 'r'] }) + '<p class="small" style="margin-top:12px"><b>Compromisos:</b> mantener la validación de soportes antes de las 11:00 a. m. y socializar el acta con los líderes en la semana.</p><p class="small muted" style="margin-top:8px">Cifras generadas desde la bitácora de COI.</p></div>', '<button class="btn btn-o" data-close>Cerrar</button><button class="btn btn-p" data-close data-done="Acta descargada en PDF.">' + ic('download') + 'Descargar PDF</button>'),
    reconfirmar: (b) => { b.outerHTML = tag('Confirmada', 'b-ok'); toast('Reconfirmación enviada por WhatsApp al mensajero.'); },
  };

  /* ================= Navegación ================= */
  const MODULES = [
    ['validacion', 'N1', 'Validación documental', 'filecheck'], ['novedades', 'N2', 'Novedades', 'inbox'], ['pqr', 'N3', 'PQR y encuestas', 'message'], ['alertas', 'N4', 'Alertas', 'bell'],
    ['reporteria', 'N5', 'Reportería y comités', 'chart'], ['facturacion', 'N6', 'Facturación', 'receipt'], ['oficinas', 'N7', 'Oficinas', 'pin'], ['fincomercio', 'N8', 'Fincomercio', 'store'], ['ptr', 'N9', 'Transacciones en vivo', 'activity'],
    ['malas', 'G1', 'Malas prácticas', 'alert'], ['papeleria', 'G2', 'Papelería', 'package'], ['usuarios', 'G3', 'Usuarios y planta', 'usercheck'], ['cheques', 'G4', 'Cheques y arqueos', 'wallet'], ['agrario', 'G5', 'Banco Agrario', 'building'], ['ingresos', 'G6', 'Correo de ingresos', 'mail'],
    ['traza', 'TRAZA', 'TRAZA', 'flow'], ['inicio', 'N0', 'Tablero gerencial', 'home']
  ];
  const NAV = [
    ['Monitoreo', [['inicio', 'Tablero gerencial', 'home'], ['analistas', 'Analistas', 'users'], ['procesos', 'Procesos', 'layers'], ['clientes', 'Clientes', 'building'], ['catalogo', 'Catálogo de actividades', 'list'], ['bitacora', 'Bitácora', 'clock']]],
    ['Operación', [['validacion', 'Validación documental', 'filecheck'], ['novedades', 'Novedades', 'inbox', 12], ['pqr', 'PQR y encuestas', 'message'], ['alertas', 'Alertas', 'bell', 1], ['fincomercio', 'Fincomercio', 'store'], ['oficinas', 'Oficinas', 'pin']]],
    ['Cifras', [['reporteria', 'Reportería y comités', 'chart'], ['facturacion', 'Facturación', 'receipt'], ['ptr', 'Transacciones en vivo', 'activity']]],
    ['Módulos Apps Script', [['malas', 'Malas prácticas', 'alert', 'G1'], ['papeleria', 'Papelería', 'package', 'G2'], ['usuarios', 'Usuarios y planta', 'usercheck', 'G3'], ['cheques', 'Cheques y arqueos', 'wallet', 'G4'], ['agrario', 'Banco Agrario', 'building', 'G5'], ['ingresos', 'Correo de ingresos', 'mail', 'G6']]],
    ['Herramientas', [['traza', 'TRAZA', 'flow'], ['implementacion', 'Plan de implementación', 'flag']]]
  ];
  let current = 'inicio';
  const NAV_CLOSED = {};
  const VIEW_LABEL = {};
  NAV.forEach((g) => g[1].forEach((it) => { VIEW_LABEL[it[0]] = [g[0], it[1]]; }));
  function renderNav(active) {
    $('#nav').innerHTML = NAV.map((g, gi) => {
      const hasActive = g[1].some((it) => it[0] === active);
      const closed = NAV_CLOSED[gi] && !hasActive;
      return '<div class="nav-group' + (closed ? ' closed' : '') + '"><button type="button" class="nav-gh" data-navg="' + gi + '" aria-expanded="' + !closed + '"><span>' + g[0] + '</span>' + ic('chevron', 'chev') + '</button><div class="nav-items">' +
        g[1].map((it) => '<button type="button" data-go="' + it[0] + '" class="nav-item ' + (active === it[0] ? 'on' : '') + '" title="' + it[1] + '">' + ic(it[2]) + '<span class="ni-l">' + it[1] + '</span>' + (typeof it[3] === 'number' ? '<span class="count">' + it[3] + '</span>' : it[3] ? '<span class="tag">' + it[3] + '</span>' : '') + '</button>').join('') + '</div></div>';
    }).join('');
  }
  function renderCrumbs(view, sub) {
    const lbl = VIEW_LABEL[view] || (view === 'analista' ? ['Monitoreo', 'Analistas'] : view === 'cliente' ? ['Monitoreo', 'Clientes'] : ['Monitoreo', 'Tablero gerencial']);
    let extra = '';
    if (view === 'analista' && AN[sub]) extra = AN[sub].name;
    if (view === 'cliente' && clients[sub]) extra = clients[sub].name;
    if (view === 'traza' && sub) extra = sub;
    $('#crumbs').innerHTML = '<span>' + lbl[0] + '</span>' + ic('chevron') + (extra ? '<span>' + lbl[1] + '</span>' + ic('chevron') + '<b>' + extra + '</b>' : '<b>' + lbl[1] + '</b>');
  }
  const NOTIFS = [['bad', 'Exceso de efectivo en BBVA Salitre', 'Hace 18 min', 'alertas'], ['warn', 'TRZ-0405 en prioridad crítica', 'CreSER, hoy', 'traza/TRZ-0405'], ['info', 'Comité BBVA listo para el 5 de noviembre', 'Reportería', 'reporteria'], ['ok', 'Soportes BBVA completos a las 10:42 a. m.', 'Validación documental', 'validacion']];
  function renderNotifs() {
    $('#dd-notif').innerHTML = '<div class="dd-h"><b>Notificaciones</b><button class="linkbtn" data-act="toast" data-k="Notificaciones marcadas como leídas.">Marcar como leídas</button></div>' + NOTIFS.map((n) => '<button class="ntf" data-go="' + n[3] + '"><span class="att-ic ' + n[0] + '">' + ic(n[0] === 'ok' ? 'check' : n[0] === 'info' ? 'clock' : 'alert') + '</span><span class="grow"><b>' + n[1] + '</b><small>' + n[2] + '</small></span></button>').join('') + '<button class="dd-f" data-go="bitacora">Ver toda la actividad</button>';
  }
  function go(path, keepScroll) {
    timers.forEach(clearInterval); timers = [];
    current = path || 'inicio';
    const parts = current.split('/');
    const view = parts[0];
    const fn = V[view] || V.inicio;
    const navKey = view === 'analista' ? 'analistas' : view === 'cliente' ? 'clientes' : (V[view] ? view : 'inicio');
    renderNav(navKey);
    renderCrumbs(view, parts[1]);
    $$('.dd-menu.open').forEach((m) => m.classList.remove('open'));
    const c = $('#content');
    const isModule = MODULES.some((m) => m[0] === view) && view !== 'inicio';
    if (!isModule && !(view === 'analista' && CTX.client)) CTX.client = null;
    try { c.innerHTML = ctxBar(view) + fn(parts[1]); }
    catch (err) { console.error(err); c.innerHTML = head('No se pudo abrir esta vista', 'Detalle técnico: ' + esc(err.message)); }
    if (!keepScroll) { c.classList.remove('view-enter'); void c.offsetWidth; c.classList.add('view-enter'); }
    if (!keepScroll) { window.scrollTo(0, 0); }
    bindCharts();
    highlightClient();
    if (view === 'fincomercio') startFinTimer();
    if (view === 'ptr') startPtr();
    $('.side').classList.remove('open'); const sc = $('#scrim'); if (sc) sc.classList.remove('show'); document.body.classList.remove('no-scroll');
    const vs = $('#viewas'); if (vs) vs.value = view === 'analista' && AN[parts[1]] ? parts[1] : '';
  }
  document.addEventListener('click', (e) => {
    const goEl = e.target.closest('[data-go]');
    if (goEl) { e.preventDefault(); if (goEl.closest('.search')) { $('#q').value = ''; $('#q-results').classList.remove('show'); } if (goEl.dataset.client) CTX.client = goEl.dataset.client; else if (goEl.closest('#nav, .search')) CTX.client = null; go(goEl.dataset.go); return; }
    const act = e.target.closest('[data-act]');
    if (act && ACTIONS[act.dataset.act]) { e.preventDefault(); ACTIONS[act.dataset.act](act); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { const tb = tab.parentElement; $$('button', tb).forEach((b) => { b.classList.toggle('on', b === tab); const p = document.getElementById(b.dataset.tab); if (p) p.hidden = b !== tab; }); return; }
    const a = e.target.closest('a[href^="#"]'); if (a) e.preventDefault();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('[data-go][tabindex]')) go(e.target.dataset.go); });
  document.addEventListener('change', (e) => { if (e.target.matches('[data-dash-sel]')) { DASH.idx = +e.target.value; go('inicio', true); } if (e.target.matches('[data-cat-who]')) { CAT.who = e.target.value; go('catalogo', true); } if (e.target.matches('[data-tz]')) { TZF[e.target.dataset.tz] = e.target.value; go('traza', true); } });
  let catTimer = null;
  let tzTimer = null;
  document.addEventListener('input', (e) => { if (e.target.matches('[data-tz-q]')) { clearTimeout(tzTimer); const v = e.target.value; tzTimer = setTimeout(() => { TZF.q = v; go('traza', true); const i = $('[data-tz-q]'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); } });
  document.addEventListener('input', (e) => { if (e.target.matches('[data-cat-q]')) { clearTimeout(catTimer); const v = e.target.value; catTimer = setTimeout(() => { CAT.q = v; go('catalogo', true); const i = $('[data-cat-q]'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); } });

  function setupSearch() {
    const inp = $('#q'), box = $('#q-results');
    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const idx = D.analysts.map((a) => ['analista/' + a.id, a.name, 'Analista']).concat(Object.keys(clients).map((k) => ['cliente/' + k, clients[k].name, 'Cliente'])).concat(MODULES.map((m) => [m[0], m[2], 'Módulo ' + m[1]])).concat([['catalogo', 'Catálogo de actividades', 'Las 104 actividades']]).concat(TZ.map((t) => ['traza/' + t.id, t.id + ', ' + t.title, 'TRAZA']));
    inp.addEventListener('input', () => {
      const q = norm(inp.value.trim());
      if (!q) { box.classList.remove('show'); return; }
      const res = idx.filter((r) => norm(r[1]).indexOf(q) >= 0).slice(0, 8);
      box.innerHTML = res.length ? res.map((r) => '<button type="button" data-go="' + r[0] + '">' + r[1] + '<span>' + r[2] + '</span></button>').join('') : '<div class="empty">Sin resultados para esa búsqueda</div>';
      box.classList.add('show');
    });
    inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('show'), 200));
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = $('[data-go]', box); if (b) { inp.value = ''; box.classList.remove('show'); go(b.dataset.go); } } });
  }
  function tickClock() { const n = new Date(); $('#clock').innerHTML = '<b>' + hhmm(n.getHours() * 60 + n.getMinutes()) + '</b>' + longDate(n); }
  function setupViewAs() {
    const s = $('#viewas');
    s.innerHTML = '<option value="">Gerencia</option>' + D.analysts.map((a) => '<option value="' + a.id + '">' + a.name + '</option>').join('');
    s.addEventListener('change', () => go(s.value ? 'analista/' + s.value : 'inicio'));
  }
  function brandMarks(size) {
    const B = window.BRAND || {};
    const rv = B.reval ? '<img class="logo-img" src="' + B.reval + '" alt="Reval">' : '<span class="wordmark ' + size + '" style="color:#fff">Reval<span class="dot">.</span></span>';
    const mp = B.multipagas ? '<img class="logo-img" src="' + B.multipagas + '" alt="Multipagas">' : '<span class="wordmark mp ' + size + '" style="color:#fff">Multipagas<span class="dot">.</span></span>';
    return rv + '<span class="brand-sep"></span>' + mp;
  }
  function enterApp() {
    const btn = $('#enter'); btn.classList.add('loading'); btn.disabled = true; $('.btn-label', btn).textContent = 'Verificando credenciales';
    setTimeout(() => {
      const l = $('#login'); l.classList.add('leaving');
      setTimeout(() => { l.hidden = true; l.classList.remove('leaving'); btn.classList.remove('loading'); btn.disabled = false; $('.btn-label', btn).textContent = 'Continuar con cuenta corporativa'; $('#app').hidden = false; go('inicio'); }, 380);
    }, 900);
  }
  function start() {
    $$('[data-marks]').forEach((el) => { el.innerHTML = brandMarks(el.dataset.marks); });
    $('#enter').addEventListener('click', enterApp);
    $('#other-acct').addEventListener('click', () => toast('En producción se abre el selector de cuentas corporativas.'));
    $('#logout').addEventListener('click', () => { $$('.dd-menu.open').forEach((m) => m.classList.remove('open')); $('#app').hidden = true; $('#login').hidden = false; window.scrollTo(0, 0); });
    const closeDrawer = () => { $('.side').classList.remove('open'); $('#scrim').classList.remove('show'); document.body.classList.remove('no-scroll'); };
    $('#scrim').addEventListener('click', closeDrawer);
    const autoCollapse = () => { const app = $('#app'); if (window.innerWidth > 900 && window.innerWidth <= 1180) app.classList.add('collapsed'); else if (window.innerWidth > 1180 && !app.dataset.userToggled) app.classList.remove('collapsed'); if (window.innerWidth > 900) closeDrawer(); };
    autoCollapse(); window.addEventListener('resize', autoCollapse);
    $('#menu').addEventListener('click', () => {
      if (window.innerWidth <= 900) { const s = $('.side'); const open = !s.classList.contains('open'); s.classList.toggle('open', open); $('#scrim').classList.toggle('show', open); document.body.classList.toggle('no-scroll', open); return; }
      $('#app').dataset.userToggled = '1';
      const app = $('#app'); app.classList.toggle('collapsed');
      $('#menu').title = app.classList.contains('collapsed') ? 'Expandir menú' : 'Contraer menú';
    });
    document.addEventListener('click', (e) => {
      const dd = e.target.closest('[data-dd]');
      if (dd) { const m = document.getElementById('dd-' + dd.dataset.dd); const was = m.classList.contains('open'); $$('.dd-menu.open').forEach((x) => x.classList.remove('open')); if (!was) m.classList.add('open'); e.stopPropagation(); return; }
      const g = e.target.closest('[data-navg]');
      if (g) { const gi = +g.dataset.navg; NAV_CLOSED[gi] = !NAV_CLOSED[gi]; g.parentElement.classList.toggle('closed'); g.setAttribute('aria-expanded', !g.parentElement.classList.contains('closed')); return; }
      if (!e.target.closest('.dd-menu')) $$('.dd-menu.open').forEach((x) => x.classList.remove('open'));
    }, true);
    document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#q'); if (q && !$('#app').hidden) q.focus(); } });
    renderNotifs(); setupSearch(); setupViewAs(); tickClock(); setInterval(tickClock, 30000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
